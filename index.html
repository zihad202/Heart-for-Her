<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eva Moni Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: rgb(5, 5, 5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* একদম স্ক্রিনের সেন্টারে রাখবে */
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        let W, H, scale;
        const TEXT = "Eva Moni";
        const PINK = "255, 77, 109";
        let points = [];
        let startTime = Date.now();

        function makePoint(x, y, target) {
            return {
                x: x,
                y: y,
                alpha: 0,
                target: target,
                delay: Math.random() * 7000
            };
        }

        // স্ক্রিনের সাইজ অনুযায়ী ক্যানভাস অ্যাডজাস্ট করার ফাংশন
        function resizeCanvas() {
            // মোবাইল স্ক্রিনের ফুল উইডথ ও হাইট নেওয়া
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;

            // মোবাইলের স্ক্রিন অনুযায়ী হার্টের সাইজ স্কেলিং
            const minDim = Math.min(W, H);
            scale = minDim / 42; 

            init();
        }

        function createHeartPoints() {
            let pts = [];
            const cx = W / 2;
            const cy = H / 2;

            // Outer Boundary
            for (let i = 0; i < 180; i++) {
                let t = (i / 180) * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                pts.push(makePoint(cx + x * scale, cy + y * scale, Math.random() * (255 - 180) + 180));
            }

            // Inner Fill Points
            const innerScales = [0.2, 0.4, 0.6, 0.8];
            for (let s of innerScales) {
                for (let i = 0; i < 80; i++) {
                    let t = (i / 80) * Math.PI * 2;
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    pts.push(makePoint(cx + x * scale * s, cy + y * scale * s, Math.random() * (180 - 80) + 80));
                }
            }

            return pts;
        }

        function init() {
            points = createHeartPoints();
            startTime = Date.now();
        }

        // কীবোর্ড R দিয়ে রিস্টার্ট
        window.addEventListener("keydown", (e) => {
            if (e.key === "r" || e.key === "R") {
                init();
            }
        });

        // স্ক্রিন রোটেট বা রিসাইজ করলে অটোমেটিক সাইজ ঠিক করা
        window.addEventListener("resize", resizeCanvas);

        function animate() {
            let elapsed = Date.now() - startTime;

            ctx.fillStyle = "rgb(5, 5, 5)";
            ctx.fillRect(0, 0, W, H);

            // মোবাইল স্ক্রিনে ফন্ট সাইজ অ্যাডজাস্টমেন্ট
            const fontSize = Math.max(10, Math.floor(Math.min(W, H) / 60));
            ctx.font = `${fontSize}px Consolas`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let p of points) {
                if (elapsed > p.delay) {
                    p.alpha += (p.target - p.alpha) * 0.004;
                }

                let alphaNormalized = p.alpha / 255;
                if (alphaNormalized > 0) {
                    ctx.fillStyle = `rgba(${PINK}, ${alphaNormalized})`;
                    ctx.fillText(TEXT, p.x, p.y);
                }
            }

            requestAnimationFrame(animate);
        }

        // প্রথমবার রান করা
        resizeCanvas();
        animate();
    </script>
</body>
</html>
