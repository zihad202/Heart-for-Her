<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eva Moni Heart - Centered</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: rgb(5, 5, 5);
            display: flex;
            justify-content: center; /* হরাইজন্টালি মাঝখানে */
            align-items: center;    /* ভার্টিক্যালি মাঝখানে */
            height: 100vh;           /* পুরো স্ক্রিন জুড় */
            overflow: hidden;
        }
        canvas {
            display: block;
            /* মোবাইল ও ডেস্কটপে ক্যানভাস যাতে ছোট না হয় বা এক কোণায় না যায় */
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        // ক্যানভাস সাইজ সবসময় স্ক্রিনের উপর নির্ভর করবে
        const W = Math.min(window.innerWidth, 800); // 800px অথবা স্ক্রিনের সাইজ, যেটি ছোট
        const H = Math.min(window.innerHeight, 800);
        canvas.width = W;
        canvas.height = H;

        const TEXT = "Eva Moni";
        const PINK = "255, 77, 109";
        let points = [];
        let startTime = Date.now();

        function makePoint(x, y, target) {
            return {
                x: x,
                y: y,
                alpha: 0,
                target: target,
                delay: Math.random() * 7000
            };
        }

        function createHeartPoints() {
            let pts = [];
            const cx = W / 2;
            const cy = H / 2;
            
            // মোবাইল স্ক্রিনের জন্য স্কেল অ্যাডজাস্ট করা হয়েছে যাতে হার্ট ফেটে না যায়
            const scale = Math.min(W, H) / 50; 

            // Outer Boundary
            for (let i = 0; i < 180; i++) {
                let t = (i / 180) * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                pts.push(makePoint(cx + x * scale, cy + y * scale, Math.random() * (255 - 180) + 180));
            }

            // Inner Fill Points
            const innerScales = [0.2, 0.4, 0.6, 0.8];
            for (let s of innerScales) {
                for (let i = 0; i < 80; i++) {
                    let t = (i / 80) * Math.PI * 2;
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    pts.push(makePoint(cx + x * scale * s, cy + y * scale * s, Math.random() * (180 - 80) + 80));
                }
            }

            return pts;
        }

        function init() {
            points = createHeartPoints();
            startTime = Date.now();
        }

        // Restart on 'R' key press
        window.addEventListener("keydown", (e) => {
            if (e.key === "r" || e.key === "R") {
                init();
            }
        });

        function animate() {
            let elapsed = Date.now() - startTime;

            // Clear Background
            ctx.fillStyle = "rgb(5, 5, 5)";
            ctx.fillRect(0, 0, W, H);

            ctx.font = "13px Consolas";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let p of points) {
                if (elapsed > p.delay) {
                    p.alpha += (p.target - p.alpha) * 0.004;
                }

                let alphaNormalized = p.alpha / 255;
                if (alphaNormalized > 0) {
                    ctx.fillStyle = `rgba(${PINK}, ${alphaNormalized})`;
                    ctx.fillText(TEXT, p.x, p.y);
                }
            }

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
